<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>VENCIVO AI | Recuperar senha</title><style>:root{--bg:#060810;--text:#f7f8fc;--muted:#9ba7b8;--cyan:#63e6ff;--line:#ffffff16;--red:#ff9f9f;--green:#57e6a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#15304455,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Arial}.card{width:min(460px,calc(100% - 24px));padding:22px;border:1px solid var(--line);border-radius:18px;background:#ffffff07;box-shadow:0 25px 80px #0007}.brand{font-weight:950;font-size:20px;margin-bottom:18px}.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),#9b7cff);color:#071018;margin-right:8px}.field{display:grid;gap:6px;margin:12px 0}.label{font-weight:800;font-size:13px}.input{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:#080d17;color:#fff;font:inherit}.btn{width:100%;padding:11px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--cyan),#b0f7ff);color:#071018;font:inherit;font-weight:900;cursor:pointer}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;font-size:12px}.error{color:var(--red)}.ok{color:var(--green)}a{color:#aeeeff}</style></head><body><main class="card"><div class="brand"><span class="logo">V</span>VENCIVO <small style="color:#8994a8">AI</small></div><h1 style="font-size:25px;margin:0 0 5px">Recuperar senha</h1><p class="muted">Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.</p><div class="field"><label class="label">E-mail</label><input id="email" class="input" type="email" autocomplete="email" placeholder="voce@empresa.com"></div><button id="send" class="btn">Enviar link de recuperação</button><div id="msg" class="msg"></div><p class="muted"><a href="conta.html">← Voltar para entrar</a></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://uxmlmyhiagjefuufanyg.supabase.co','sb_publishable_wAajSubj-zZE7kFh7EAxog_2FxCrs6Z'),$=id=>document.getElementById(id);$('send').onclick=async()=>{const email=$('email').value.trim();if(!email){$('msg').className='msg error';$('msg').textContent='Informe seu e-mail.';return}$('send').disabled=true;$('send').textContent='Enviando...';try{const{error}=await s.auth.resetPasswordForEmail(email,{redirectTo:new URL('redefinir-senha.html',location.href).href});if(error)throw error;$('msg').className='msg ok';$('msg').textContent='Se existir uma conta para esse e-mail, enviaremos as instruções de recuperação.'}catch(e){$('msg').className='msg error';$('msg').textContent='Não foi possível enviar o link agora. Tente novamente mais tarde.'}finally{$('send').disabled=false;$('send').textContent='Enviar link de recuperação'}};</script></body></html>
