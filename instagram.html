<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>Conectar Instagram · VENCIVO</title><style>:root{--bg:#070910;--panel:#0d121e;--text:#f7f9fc;--muted:#9ba8ba;--cyan:#63e6ff;--violet:#9b7cff;--green:#57e6a8;--line:#ffffff14;--danger:#ff9daa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#16324755,transparent 35%),radial-gradient(circle at 10% 70%,#34235a30,transparent 30%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{width:min(680px,calc(100% - 24px));margin:auto}.card{margin:10vh auto 0;padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#ffffff0a,#ffffff03);box-shadow:0 25px 90px #0008;text-align:center}.logo{width:58px;height:58px;margin:0 auto 16px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#071018;font-weight:950;font-size:24px}.eyebrow{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:#d8e2ee;font-size:12px}h1{font-size:clamp(34px,6vw,52px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 12px}.grad{background:linear-gradient(100deg,#fff,var(--cyan),var(--violet));-webkit-background-clip:text;color:transparent}.lead{color:var(--muted);font-size:17px;max-width:540px;margin:0 auto}.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;padding:13px 18px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--cyan),#b0f7ff);color:#071018;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.msg{margin-top:15px;color:var(--muted);font-size:13px}.err{color:var(--danger)}.ok{color:var(--green)}.back{display:inline-block;margin-top:18px;color:#b9c5d5;font-size:13px}</style></head><body><main class="wrap"><section class="card"><div class="logo">◎</div><span class="eyebrow">VENCIVO · Instagram</span><h1>Conecte seu <span class="grad">Instagram.</span></h1><p class="lead">O VENCIVO usa seu Instagram como canal de oportunidades para ajudar sua empresa a atender, qualificar e não perder conversas comerciais.</p><button class="btn" id="connect">Conectar Instagram com segurança →</button><div class="msg" id="msg">Você será levado ao Instagram para autorizar o acesso.</div><a class="back" href="conta.html">← Voltar para minha conta</a></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://uxmlmyhiagjefuufanyg.supabase.co','sb_publishable_wAajSubj-zZE7kFh7EAxog_2FxCrs6Z',{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});const btn=document.getElementById('connect'),msg=document.getElementById('msg');btn.onclick=async()=>{btn.disabled=true;msg.className='msg';msg.textContent='Preparando conexão...';try{const{data,error}=await supabase.auth.getSession();if(error||!data.session)throw new Error('Faça login no VENCIVO antes de conectar o Instagram.');const r=await fetch('/api/instagram-login',{headers:{Authorization:'Bearer '+data.session.access_token},cache:'no-store'});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'Não foi possível iniciar a conexão.');window.location.href=p.authorization_url}catch(e){msg.className='msg err';msg.textContent=e.message||'Não foi possível iniciar a conexão.';btn.disabled=false}}</script></body></html>
