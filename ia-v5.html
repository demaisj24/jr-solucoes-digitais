<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>VENCIVO AI | Criador</title>
</head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('ia-v3.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar o criador.');
    let html=await r.text();
    const old="function step2(){if(!$('empresa').value.trim()||!$('segmento').value||!$('oferta').value.trim()){toast('Preencha empresa, segmento e produtos/serviços.');return}save();show(2)}";
    const fixed="function step2(){const empresa=$('empresa').value.trim();const segmento=$('segmento').value;const oferta=$('oferta').value.trim();const hasKnowledge=Boolean(oferta||knowledge||$('file').files.length);if(!empresa||!segmento||!hasKnowledge){toast('Preencha empresa, segmento e forneça produtos/serviços ou uma base de conhecimento.');return}save();show(2)}";
    if(!html.includes(old)) throw new Error('Versão do criador incompatível com a correção esperada.');
    html=html.replace(old,fixed);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<p style="font:16px system-ui;padding:24px">Não foi possível carregar o Criador VENCIVO AI. Tente novamente.</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
