name: Supabase Keepalive

# Evita a pausa por inatividade do projeto Supabase Free (uxmlmyhiagjefuufanyg)
# com 1 SELECT minimo, 2x por semana. Roda fora do Vercel de proposito — nao
# consome Serverless Function nem Vercel Cron. Nao faz checkout.
#
# Decisoes deliberadas:
# - Usa a chave anonima do Supabase (SUPABASE_ANON_KEY), nunca service role.
# - Consulta somente plan_catalog, sem acessar tabelas com dados de usuario.
# - curl falha em HTTP >= 400 e possui timeouts curtos explicitos.
on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Supabase REST API (plan_catalog, chave anonima, somente leitura)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 10 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/plan_catalog?select=code&active=eq.true&limit=1" \
            -o /dev/null
