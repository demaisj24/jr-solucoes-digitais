name: VENCIVO Data Retention

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-rate-limit-buckets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Remove expired rate-limit buckets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}" || { echo "SUPABASE_URL is not configured" >&2; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "SUPABASE_SERVICE_ROLE_KEY is not configured" >&2; exit 1; }

          cutoff="$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: return=minimal" \
            "${SUPABASE_URL}/rest/v1/rate_limit_buckets?updated_at=lt.${cutoff}" \
            -o /dev/null
