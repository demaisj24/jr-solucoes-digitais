<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Agente VENCIVO AI</title><style>:root{--bg:#060810;--panel:#0d1220;--text:#f7f8fc;--muted:#9ba7b8;--cyan:#63e6ff;--violet:#9b7cff;--green:#57e6a8;--line:#ffffff16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17344a55,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Arial}.wrap{width:min(820px,calc(100% - 20px));margin:auto}.top{padding:14px 0;border-bottom:1px solid var(--line);background:#080b14dd;backdrop-filter:blur(16px)}.nav{display:flex;align-items:center;gap:10px}.brand{font-weight:900;display:flex;align-items:center;gap:9px}.logo,.avatar{display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#071018;font-weight:950}.logo{width:34px;height:34px;border-radius:10px}.back{margin-left:auto;color:#cbd5e1;text-decoration:none}.hero{text-align:center;padding:26px 0 14px}.eyebrow{display:inline-block;color:var(--green);border:1px solid #57e6a833;border-radius:999px;padding:5px 10px;font-size:12px}.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.02;letter-spacing:-.04em;margin:10px 0 5px}.hero p{margin:0;color:var(--muted)}.chat{height:min(650px,calc(100vh - 180px));min-height:520px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#07101a;display:flex;flex-direction:column;box-shadow:0 25px 90px #0007}.head{padding:13px 15px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#111b2d,#0b1220);border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;border-radius:12px}.name{font-weight:900}.online{color:var(--green);font-size:11px}.messages{padding:16px;display:flex;flex-direction:column;gap:9px;overflow:auto;flex:1}.msg{max-width:84%;padding:11px 13px;border-radius:15px;white-space:pre-wrap}.bot{background:#111a2a;border:1px solid #ffffff0c}.user{align-self:flex-end;background:linear-gradient(135deg,#4fdcf5,#8d73ef);color:#071018;font-weight:700}.inputrow{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}input{min-width:0;flex:1;background:#080d17;border:1px solid var(--line);border-radius:12px;padding:12px;color:#fff;font:inherit;outline:0}button{border:0;border-radius:12px;padding:0 18px;background:linear-gradient(135deg,var(--cyan),#b0f7ff);font-weight:900;cursor:pointer}.note{text-align:center;color:#657286;font-size:10px;padding:7px}.install{text-align:center;margin:14px 0 0}.install a{display:inline-flex;align-items:center;justify-content:center;border:1px solid #63e6ff35;border-radius:11px;padding:11px 15px;background:#63e6ff09;color:#dff9ff;font-weight:800;text-decoration:none}.error{color:#ffb1b9}@media(max-width:560px){.chat{height:calc(100vh - 155px);min-height:500px}.hero{padding:18px 0 10px}.hero h1{font-size:32px}.back{font-size:13px}}</style></head><body><header class="top"><div class="wrap nav"><div class="brand"><span class="logo">V</span><span>VENCIVO AI</span></div><a class="back" href="index.html">← Voltar ao VENCIVO</a></div></header><main class="wrap"><section class="hero"><span class="eyebrow">● atendimento inteligente</span><h1 id="title">Agente VENCIVO AI</h1><p id="subtitle">Atendimento personalizado</p></section><section class="chat"><div class="head"><div class="avatar" id="avatar">AI</div><div><div class="name" id="name">Agente de IA</div><div class="online">● online</div></div></div><div class="messages" id="messages"><div class="msg bot">Carregando seu agente...</div></div><div class="inputrow"><input id="input" placeholder="Digite sua mensagem..." autocomplete="off"><button id="send">Enviar</button></div><div class="note">Atendimento demonstrativo por VENCIVO AI.</div></section><div class="install"><a href="implantacao-whatsapp.html">Como colocar este agente no WhatsApp da minha empresa →</a></div></main><script>const id=new URLSearchParams(location.search).get('id');const $=s=>document.querySelector(s);let history=[];const session=crypto.randomUUID?crypto.randomUUID():String(Date.now());function add(text,role='bot'){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;$('#messages').appendChild(d);$('#messages').scrollTop=$('#messages').scrollHeight}async function load(){if(!id){add('Agente não identificado. Abra o link fornecido pela VENCIVO.');return}try{const r=await fetch('/api/agents?id='+encodeURIComponent(id));const p=await r.json();if(!r.ok)throw new Error(p.error||'Agente não encontrado');const a=p.agent;$('#title').textContent=a.agent_name;$('#subtitle').textContent=a.company_name+' · '+a.segment;$('#name').textContent=a.agent_name;$('#avatar').textContent=a.agent_name.slice(0,2).toUpperCase();$('#messages').innerHTML='';add('Olá! Eu sou o assistente virtual da '+a.company_name+'. Como posso ajudar?')}catch(e){$('#messages').innerHTML='';add(e.message)}}async function send(){const input=$('#input');const text=input.value.trim();if(!text||!id)return;input.value='';add(text,'user');history.push({role:'user',content:text});const thinking=document.createElement('div');thinking.className='msg bot';thinking.textContent='Pensando...';$('#messages').appendChild(thinking);try{const r=await fetch('/api/agent-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent_id:id,session_id:session,nova_mensagem:text,historico_mensagens:history})});const p=await r.json();thinking.remove();if(!r.ok)throw new Error(p.error||'Não foi possível responder.');add(p.reply);history.push({role:'assistant',content:p.reply})}catch(e){thinking.remove();add(e.message)}}$('#send').onclick=send;$('#input').onkeydown=e=>{if(e.key==='Enter')send()};load();</script></body></html>
